apis:
- aid: yes-energy:datasignals-api
  name: Yes Energy DataSignals API
  description: >-
    DataSignals is Yes Energy's REST API for automated access to its
    North American wholesale power market data — nodal prices, transmission,
    generation, outages, constraints, weather, and fuels — covering real-time
    and 15+ years of history, with time-series and object endpoints intended for
    Excel, Python, R, and system integration. The service host is live and
    confirmed at https://services.yesenergy.com/PS/rest/, which returns HTTP 401
    with `WWW-Authenticate: Basic realm="Realm"` to anonymous callers; HTTP Basic
    credentials are issued only to paying subscribers. The endpoint reference and
    code examples live in the customer knowledge base at help.yesenergy.com,
    which 302-redirects to the services.yesenergy.com customer login, so no
    endpoint list, no scopes, and no machine-readable specification could be
    verified anonymously. Nothing beyond the base path and auth scheme is
    recorded here because nothing beyond that is publicly observable.
  humanURL: https://www.yesenergy.com/products/datasignals
  baseURL: https://services.yesenergy.com/PS/rest/
