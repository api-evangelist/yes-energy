name: Yes Energy
kind: company
description: >-
  Yes Energy is a Boulder, Colorado power market data company serving
  the North American wholesale electricity markets — the seven ISOs and RTOs
  (ERCOT, PJM, MISO, CAISO, SPP, ISO-NE, NYISO) plus Canadian and Western
  markets. It aggregates, cleans, and enriches nodal locational marginal prices,
  FTR auction results, transmission and generation outages, real-time generation
  and flow telemetry, constraints, load, weather, and fuels data, and sells it
  through DataSignals (a REST API), DataSignals Cloud (Snowflake Secure Data
  Sharing), DataSignals Lake (bulk load into a customer warehouse), the
  PowerSignals and QuickSignals analyst front ends, EnCompass modeling, Live
  Power telemetry, Infrastructure Insights, Position Management, and bid-to-bill
  Submission Services. It sits in the private, commercial layer of the energy
  value chain: it does not generate, distribute, or retail electricity and it
  holds no consumer relationship — it resells and enriches public ISO/RTO market
  data to traders, IPPs, utilities, and asset developers. Its API posture is
  honestly closed: the DataSignals REST API is real and confirmed live at
  https://services.yesenergy.com/PS/rest/, but it answers every anonymous
  request with HTTP 401 and WWW-Authenticate Basic, and even the product
  documentation (help.yesenergy.com) redirects through
  services.yesenergy.com/PS/KnowledgeOwlAuthentication to a customer login. No
  public developer portal, no self-serve signup, no machine-readable
  specification, and no free tier are published. Home market is the United
  States. There is no consumer energy data mandate that applies to Yes Energy —
  it is not a utility, retailer, or metering agent, so Green Button, ESPI, and
  the Consumer Data Right are all out of scope — and while the underlying
  ISO/RTO market data is publicly available at the source, Yes Energy itself
  publishes none of it openly.
