    status: 404
  - url: https://www.yesenergy.com/robots.txt
    status: 200
  - url: https://www.yesenergy.com/sitemap.xml
    status: 200
    note: Full sitemap crawled for api/doc/developer/data paths — only marketing,
      blog, news, and product pages. No developer area.
  - url: https://www.yesenergy.com/products/datasignals
    status: 200
    note: Product page. Confirms "REST API" delivery, time-series and object
      endpoints, Excel/Python/R integration, prebuilt code examples, throttle
      limits. Publishes no base URL, no endpoint list, no auth detail.
  - url: https://www.yesenergy.com/datasignals-20
    status: 200
    note: Confirms three delivery modes — DataSignals API (REST), DataSignals
      Cloud (Snowflake), DataSignals Lake (bulk load to Databricks/Redshift/etc,
      refreshed every 30 minutes).
  - url: https://www.yesenergy.com/solutions/it-data-scientist
    status: 200
    note: No documentation links; routes to phone/email/demo.
  - url: https://www.yesenergy.com/support
    status: 200
    note: Human support only — phone, email, hours. No knowledge base link, no
      developer resources, no status page link.
  - url: https://www.yesenergy.com/packages
    status: 200
    note: Market data packages page. No public price list of API tiers harvested.
  - url: https://status.yesenergy.com/
    status: 200
