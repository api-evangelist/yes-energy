      Energy Full Dataset (GZSOZ71OEG), Live Power 5-Minute Generation and
      Transmission Data (GZSOZ71OHB), FTR Position P&L and Risk Data (GZSOZ71OHF),
      Infrastructure Insights (GZSOZ1GJEJ4W), Sample Data (GZSOZ71OJH), and Basic
      Trial Data (GZSOZ71OJL). Secure Data Sharing, not an HTTP API.
  - url: https://api.github.com/orgs/yesenergy
    status: 404
    note: No official GitHub organization. GitHub repo search for "yesenergy"
      returned 4 unaffiliated personal repositories, none an official SDK.
  - url: https://pypi.org/pypi/yesenergy/json
    status: 404
    note: No official Python SDK published under that name.

artifacts:
  openapiHarvested: false
  specsCount: 0
  reason: >-
    No machine-readable specification is reachable. Every candidate spec path is
    either 404 on the public hosts or 401 behind the /PS/ Basic-auth realm, and
    the API reference lives inside a login-gated KnowledgeOwl knowledge base.
    Nothing was written to openapi/ because nothing real was retrieved — no spec
    was reconstructed, inferred, or invented.

